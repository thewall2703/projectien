<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pitch Studio">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#f3efe7" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#d8d2c6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2b2823" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect x="3" y="3" width="58" height="58" rx="14" ry="14" fill="url(#glass)" stroke="rgba(255,255,255,0.9)" stroke-width="1.25" filter="url(#soft)"/>

  <!-- Soft grid -->
  <g stroke="rgba(43,40,35,0.10)" stroke-width="0.75">
    <path d="M21.5 8.5v47"/>
    <path d="M42.5 8.5v47"/>
    <path d="M8.5 21.5h47"/>
    <path d="M8.5 42.5h47"/>
  </g>

  <!-- Top glass sheen -->
  <path d="M10 12.5c2.5-4 7-6.5 14-6.5h16c7 0 11.5 2.5 14 6.5 0 0-4.5 5-14 5H24c-9.5 0-14-5-14-5z" fill="url(#sheen)"/>

  <!-- PS mark -->
  <text
    x="32"
    y="39.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="700"
    letter-spacing="-0.5"
  >
    <tspan fill="#F5C518">P</tspan><tspan fill="#0B0B0F">S</tspan>
  </text>
</svg>
