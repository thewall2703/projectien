name: pitch-studio
region: sgp
services:
  - name: web
    github:
      repo: thewall2703/projectien
      branch: main
      deploy_on_push: true
    source_dir: /pitch-studio
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
    envs:
      - key: COOKIE_SECURE
        scope: RUN_TIME
        value: "true"
      - key: OPENROUTER_MODEL
        scope: RUN_TIME
        value: openai/gpt-5.6-sol
databases:
  - name: pitch-studio-pg
    engine: PG
    production: true
    cluster_name: mu-pitch-studio-pg
